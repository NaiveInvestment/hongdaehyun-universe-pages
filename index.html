<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1318">
  <meta name="robots" content="noindex, nofollow">
  <title>홍대현 Universe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1318'/%3E%3Cpath d='M6 22 L13 13 L19 18 L26 8' fill='none' stroke='%238fb7e0' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=c18dce943cfe">
  <script type="module" src="app.js?v=0594faecd676&mode=static"></script>
</head>
<body>
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  <div class="app">
    <aside class="sidebar" aria-label="탐색">
      <div class="brand"><a href="#/">홍대현 <span>Universe</span></a></div>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="종목명 / 6자리 코드" autocomplete="off" aria-label="종목 검색">
        <span class="hint" id="searchHint"></span>
      </label>
      <p class="nav-title">섹터</p>
      <ul class="nav" id="sectorNav"></ul>
      <div class="side-foot">
        <span id="connectionState" class="status" role="status" aria-live="polite">데이터 연결 중</span>
        <span id="lastUpdated" aria-live="polite">최근 갱신 —</span>
        <span id="sourceFoot"></span>
        <button id="themeToggle" class="btn" type="button" aria-pressed="false">◐ 라이트 / 다크</button>
      </div>
    </aside>
    <div class="main" id="main">
      <main class="content" id="content">
        <nav class="mobile-nav" id="mobileNav" aria-label="섹터 탐색"></nav>
        <div id="view"></div>
      </main>
      <aside class="drawer" id="drawer" aria-label="종목 상세" hidden></aside>
    </div>
  </div>
</body>
</html>
